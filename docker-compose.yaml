#Structure:
# mosquitto
# timescaledb
# consumer 
# garfana



services:
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto
    ports:
      - "1883:1883"

  timescaledb:
    container_name: timescaledb
    image: timescale/timescaledb:latest-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql

  consumer:
    container_name: consumer
    build:
      context: . # from the root
      dockerfile: src_pipeline/dockerfiles/consumer.dockerfile
    env_file:
      - .env
    depends_on:
      - mosquitto
      - timescaledb
  grafana:
    container_name: grafana
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docs/grafana/infraredfox-mini-safety-dashboard.json:/var/lib/grafana/dashboards/infraredfox-mini-safety-dashboard.json
      - ./docs/grafana/provisioning/dashboard:/etc/grafana/provisioning/dashboards
      - ./docs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - timescaledb # let the db start before.

volumes:
  timescale_data:
  grafana_data:


  